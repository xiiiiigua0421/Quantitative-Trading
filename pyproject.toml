[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-trading"
version = "0.1.0"
description = "Reproducible US daily backtesting and paper-only execution"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<4",
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
  "pyarrow>=18,<24",
  "exchange-calendars>=4.5,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
qt = "quant_trading.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

