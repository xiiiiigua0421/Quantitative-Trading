# SPY is an interface example, not an investment recommendation.
symbol: SPY
initial_cash: 10000
data_path: ../data/cache/SPY.parquet
output_dir: ../reports/SPY
state_path: ../state/alpaca-paper.sqlite3
feed: iex
strategy:
  fast_window: 20
  slow_window: 60
costs:
  commission_bps: 1
  slippage_bps: 5
  min_commission: 0
risk:
  target_fraction: 0.5
  max_position_fraction: 0.8
  max_order_notional: 5000
  cash_buffer_fraction: 0.1
  max_drawdown: 0.15
